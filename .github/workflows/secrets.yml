name: Security Secret Scan

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: "[Security] Checkout Repository"
        uses: actions/checkout@v4

      - name: "[Security] Starting Secret Scan"
        run: echo "[Security] Checking repository for secrets..."

      - name: "[Security] Install Gitleaks"
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh \
            | sh -s -- -b "$RUNNER_TEMP" v8.30.1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: "[Security] Run Gitleaks Scan"
        run: |
          gitleaks dir . \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json

      - name: "[Security] No Secrets Found"
        if: success()
        run: echo "[Security] No secret leaks detected. Repository is secure."

      - name: "[Security] Show Secret Locations"
        if: failure()
        run: |
          if [ -s gitleaks-report.json ]; then
            echo "[Security] Secret locations found:"
            jq -r '.[] | "- \(.File):\(.StartLine) [\(.RuleID)]"' gitleaks-report.json
          else
            echo "[Security] No Gitleaks report was generated."
          fi

      - name: "[Security] Upload Redacted Gitleaks Report"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: "[Security] Secret Detection Failed"
        if: failure()
        run: |
          echo "[Security] Potential secret detected!"
          echo "[Security] Please remove secrets from code before merging."
          exit 1
