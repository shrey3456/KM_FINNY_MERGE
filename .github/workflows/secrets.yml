name: Security Secret Scan

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: "[Security] Checkout Repository"
        uses: actions/checkout@v4

      - name: "[Security] Start Secret Scan"
        run: |
          echo "[Security] Event: ${{ github.event_name }}"
          echo "[Security] Ref: ${{ github.ref }}"
          echo "[Security] Commit: ${{ github.sha }}"
          echo "[Security] Scanning checked-out source files for committed secrets..."

      - name: "[Security] Install Gitleaks"
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail

          echo "[Security] Downloading Gitleaks v${GITLEAKS_VERSION}..."
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"

          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

          echo "[Security] Installed Gitleaks:"
          "$RUNNER_TEMP/gitleaks" version

      - name: "[Security] Run Gitleaks Scan"
        id: gitleaks-scan
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/gitleaks" dir . \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json

      - name: "[Security] No Secrets Found"
        if: steps.gitleaks-scan.outcome == 'success'
        run: echo "[Security] No secret leaks detected."

      - name: "[Security] Show Secret Locations"
        if: failure() && steps.gitleaks-scan.outcome == 'failure'
        run: |
          set -euo pipefail

          if [ ! -s gitleaks-report.json ]; then
            echo "[Security] Gitleaks failed, but no report file was generated."
            exit 0
          fi

          echo "[Security] Potential secrets detected at these locations:"
          jq -r '.[] | "- \(.File):\(.StartLine) [\(.RuleID)]"' gitleaks-report.json

          echo "[Security] Adding GitHub check annotations..."
          jq -r '.[] | @base64' gitleaks-report.json | while read -r finding; do
            file="$(echo "$finding" | base64 --decode | jq -r '.File')"
            line="$(echo "$finding" | base64 --decode | jq -r '.StartLine')"
            rule="$(echo "$finding" | base64 --decode | jq -r '.RuleID')"
            echo "::error file=${file},line=${line},title=Secret detected::Gitleaks matched rule ${rule}. Secret value is redacted."
          done

      - name: "[Security] Upload Redacted Gitleaks Report"
        if: failure() && steps.gitleaks-scan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: "[Security] Secret Detection Failed"
        if: failure() && steps.gitleaks-scan.outcome == 'failure'
        run: |
          echo "[Security] Secret scan failed."
          echo "[Security] Open the failed check above to see file names, line numbers, and rule IDs."
          echo "[Security] Remove the secret from code and store it in GitHub Secrets or your .env file instead."
          exit 1
