name: PR Title Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title-check:
    runs-on: ubuntu-latest

    steps:
      - name: "[PR Check] Validating Pull Request Title"
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            Feat
            fix
            Fix
            docs
            Docs
            style
            Style
            refactor
            Refactor
            test
            Test
            chore
            Chore
            ci
            Ci
            build
            Build
            perf
            Perf
            revert
            Revert

          # Scope is optional: GitHub auto-fills a single-commit PR's title from
          # the commit message, so requiring "(scope)" made plain "feat: ..." /
          # "fix: ..." commit messages fail validation. A "type:" prefix is still
          # required, but the scope is now optional.
          requireScope: false
          # Accept both conventional "fix: subject" and title-case "Fix subject"
          # prefixes while keeping the allowed release types constrained.
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?:? (.*)$'
          headerPatternCorrespondence: type, scope, subject

      - name: "[PR Check] Pull Request Title Validation Passed"
        if: success()
        run: echo "[PR Check] Pull request title follows naming conventions."

      - name: "[PR Check] Pull Request Title Validation Failed"
        if: failure()
        run: |
          echo "[PR Check] Invalid pull request title!"
          echo "[PR Check] Title must start with a type. Scope is optional."
          echo "[PR Check] Valid examples:"
          echo "feat: add vehicle scan validation"
          echo "feat(scanning): add vehicle scan validation"
          echo "fix: resolve login issue"
          echo "refactor(report): optimize report query"
          exit 1
